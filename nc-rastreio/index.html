<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastrear pedido · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css?v=2">
<script src="/nc-core/js/core.js?v=2"></script></head><body>
<main>
<style>.tl{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:0}.tl li{position:relative;padding:0 0 22px 34px;color:var(--mut)}.tl li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}.tl li::after{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::after{display:none}.tl li.ok{color:var(--bone)}.tl li.ok::before{background:var(--ok);border-color:var(--ok)}.tl li small{display:block}</style>
<h1 class="ttl">Rastrear pedido</h1><p class="sub">Informe o número do pedido (começa com NC-).</p>
<form id="fm" class="card" style="padding:18px;display:grid;gap:12px;max-width:560px"><div><label for="id">Número do pedido</label><input id="id" placeholder="NC-..." autocomplete="off"></div><div id="mine"></div><button class="btn" type="submit">Consultar</button><div class="err" id="er" role="alert"></div></form>
<div id="res" style="max-width:560px;margin-top:20px"></div>
</main>
<script>
const {$,esc,qs,orders,API,brl}=NC;
const mine=orders.all();
$('#id').value=qs('pedido')||mine[0]?.id||'';
if(mine.length)$('#mine').innerHTML=`<label>Seus pedidos neste aparelho</label><div class="chips" style="margin:0">${mine.map(o=>`<button type="button" class="chip" data-id="${esc(o.id)}">${new Date(o.date).toLocaleDateString('pt-BR')} · ${brl(o.total)}</button>`).join('')}</div>`;
$('#mine').onclick=e=>{const b=e.target.closest('[data-id]');if(b){$('#id').value=b.dataset.id;go()}};
const STEPS=['Pedido recebido','Pagamento aprovado','Em separação','Enviado','Entregue'];
async function go(){const id=$('#id').value.trim();$('#er').textContent='';$('#res').innerHTML='';
 if(!/^NC-[a-f0-9-]{36}$/i.test(id)){$('#er').textContent='Número de pedido inválido.';return}
 try{const r=await fetch(`${API}/api/orders/${encodeURIComponent(id)}/status`);if(r.status===404){$('#er').textContent='Pedido não encontrado.';return}if(!r.ok)throw 0;
  const d=await r.json(),ap=d.approved||d.status==='approved',bad=['rejected','cancelled','refunded','charged_back'].includes(d.status),n=ap?2:1;
  $('#res').innerHTML=`<div class="card" style="padding:20px"><b style="word-break:break-all">${esc(id)}</b>${bad?`<p class="err">Pagamento não aprovado (${esc(d.status)}).</p>`:`<ol class="tl">${STEPS.map((s,k)=>`<li class="${k<n?'ok':''}">${s}${k===2&&ap?'<small>Atualizações de envio aparecem aqui quando a loja liberar o rastreio.</small>':''}${k===1&&!ap?'<small>Aguardando confirmação do pagamento.</small>':''}</li>`).join('')}</ol>`}</div>`}
 catch{$('#er').textContent='Não foi possível consultar agora. Tente novamente em instantes.'}}
$('#fm').onsubmit=e=>{e.preventDefault();go()};if(qs('pedido'))go();
</script>
</body></html>
